<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<title>연금·절세 통합관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#efeeea; --line:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --p-credit:#2a78d6; --p-non:#9fb7d6; --p-retire:#6250d6; --p-gain:#1baf7a; --p-loss:#e34948;
  --good:#0a7d3c; --warn:#a15c00; --warn-bg:#fff4e0; --info-bg:#eaf2fc;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-soft:#1c2c40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --p-credit:#3987e5; --p-non:#4f6a8c; --p-retire:#9085e9; --p-gain:#199e70; --p-loss:#e66767;
    --good:#4cc27e; --warn:#f0b45a; --warn-bg:#3a2a12; --info-bg:#1c2c40;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--text-2);padding:5px 10px;border-radius:8px;font:inherit;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding:4px 12px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.card h2 .sp{flex:1}
.hero .lbl{color:var(--text-2);font-size:13px}
.hero .num{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--text-2);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .lbl{font-size:12px;color:var(--text-2)}
.tile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--text-2)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--good)} .neg{color:var(--p-loss)}
.alert{border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px;display:flex;gap:8px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--text)}
.alert b{flex:none}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--p-loss);border:1px solid var(--p-loss)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.acc{cursor:pointer}
.acc .top{display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.badge.isa{background:#e5f6ee;color:#0b7a52} .badge.irp{background:#efecfb;color:#5444c4} .badge.general{background:var(--surface-2);color:var(--text-2)}
@media (prefers-color-scheme: dark){.badge.isa{background:#173328;color:#5fd3a3}.badge.irp{background:#25213f;color:#a99ff0}}
.acc .name{font-weight:700;flex:1}
.acc .val{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px;gap:2px;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:5px 0 0 5px}.bar i:last-child{border-radius:0 5px 5px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .hd h3{margin:0;font-size:17px;flex:1}
label.f{display:block;margin:8px 0}
label.f>span{display:block;font-size:12px;color:var(--text-2);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}
input[type=checkbox]{width:auto}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.t th{color:var(--text-2);font-weight:600;font-size:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.strat{display:grid;gap:8px}
.strat .s{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.strat .s.on{border-color:var(--accent)}
.strat .s .t1{display:flex;align-items:center;gap:6px;font-weight:700}
.strat .s .t1 i{width:10px;height:10px;border-radius:50%}
.strat .s .best{font-size:11px;background:var(--good);color:#fff;padding:1px 6px;border-radius:5px}
.strat .s .d{font-size:12px;color:var(--text-2);margin:2px 0 6px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.dep{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dep .d1{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s}
.toast.on{opacity:.95}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.cloud{font-size:11px;color:var(--muted);white-space:nowrap}
.menu{border:0;background:var(--surface-2);color:var(--text);border-radius:9px;width:32px;height:30px;font-size:18px;line-height:1;cursor:pointer}
.cflink{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent);text-decoration:none}
a.applink{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
a.applink .sp{flex:1}
label.ck{font-size:13px;font-weight:500;display:inline-flex;gap:4px;align-items:center;color:var(--text-2)}
.badge.cf{background:#fdeee6;color:#b94a17}
@media (prefers-color-scheme: dark){.badge.cf{background:#3a2216;color:#f39a6b}}
.dep[data-act]{cursor:pointer}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'›';margin-left:auto;color:var(--muted);font-size:18px;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>summary .meta{font-weight:400}
details.fold>.body{padding:0 16px 14px}
details.fold>.body>.card{margin:8px 0;border-color:var(--line)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi .k1{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.kpi .lbl{font-size:12px;color:var(--text-2)}
.kpi .big{font-size:21px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .sub{font-size:12px;color:var(--muted)}
.ok{color:var(--good)} .bad{color:var(--p-loss)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:12px 0 8px}
.stack i{display:block;height:100%}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.leg2 span{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.leg2 b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
.leg2 i{width:9px;height:9px;border-radius:3px;flex:none}
.step{display:flex;align-items:center;gap:8px}
.step .no{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cond{font-size:14px;color:var(--text-2);line-height:1.6}
.cond b{color:var(--text)}
.more{font-size:13px;color:var(--muted);text-align:center;padding:4px 0}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--text)}
.ret{font-size:13px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>연금·절세 통합관리 <span class="cloud" id="cloud"></span></h1>
  <div class="seg" id="ownerSeg"></div>
  <button class="menu" data-act="appMenu" aria-label="다른 앱으로 이동">⋮</button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>

<script>
/* 연금·절세 계산 엔진 — 순수 함수, DOM 의존 없음
 * 금액 단위: 원
 * 세법 기준값은 RULES 한곳에 모음 (세법 개정 시 여기만 수정)
 */
(function (root) {
  'use strict';

  const RULES = {
    year: 2026,
    pensionCreditCap: 6000000,      // 연금저축 세액공제 한도
    totalCreditCap: 9000000,        // 연금저축+IRP 합산
    isaTransferCreditRate: 0.10,    // ISA 만기 이전 추가공제 비율
    isaTransferCreditCap: 3000000,  // 추가공제 최대
    annualDepositCap: 18000000,     // 연금저축+IRP 연 납입한도
    creditRateUnder: 0.165,         // 총급여 5,500만 이하
    creditRateOver: 0.132,
    pensionAgeRates: [[80, 0.033], [70, 0.044], [55, 0.055]], // 지방세 포함
    otherIncomeRate: 0.165,         // 연금외수령·분리과세 선택 시
    privatePensionThreshold: 15000000,
    retireFactor: n => (n <= 10 ? 0.7 : n <= 20 ? 0.6 : 0.5), // 이연퇴직소득세 적용비율
    isaTaxFree: { normal: 2000000, low: 4000000 },
    isaRate: 0.099,
    isaAnnualCap: 20000000,
    minAge: 55,
    minYears: 5,
    // 종합소득세 누진세율 [과세표준 상한, 세율, 누진공제]
    brackets: [[14e6, .06, 0], [50e6, .15, 1.26e6], [88e6, .24, 5.76e6], [150e6, .35, 15.44e6],
               [300e6, .38, 19.94e6], [500e6, .40, 25.94e6], [1e9, .42, 35.94e6], [Infinity, .45, 65.94e6]],
    basicDeduction: 1500000,
    // 지역 건강보험료 (2026: 건보 7.19%, 장기요양 0.9448%)
    hiRate: 0.0719, ltcRate: 0.009448,
    hiPublicShare: 0.5,          // 공적연금은 절반만 부과 (사적연금·ISA는 부과 안 함)
    hiFinThreshold: 10000000,    // 이자·배당 연 1,000만원 초과 시 전액 부과
    hiDependentLimit: 20000000,  // 피부양자 소득 기준 연 2,000만원
    yearlyDepositCap: 18000000
  };

  const PENSION_TYPES = ['pension', 'irp'];
  const isPension = a => PENSION_TYPES.includes(a.type);
  const yearOf = d => (d ? parseInt(String(d).slice(0, 4), 10) : null);
  const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
  const r0 = x => Math.round(x);

  /* ---------- 세금 기초 ---------- */
  function pensionIncomeDeduction(x) {
    let d;
    if (x <= 3.5e6) d = x;
    else if (x <= 7e6) d = 3.5e6 + (x - 3.5e6) * 0.4;
    else if (x <= 14e6) d = 4.9e6 + (x - 7e6) * 0.2;
    else d = 6.3e6 + (x - 14e6) * 0.1;
    return Math.min(d, 9e6);
  }
  function progressiveTax(base) {
    if (base <= 0) return 0;
    for (const [cap, rate, ded] of RULES.brackets) if (base <= cap) return base * rate - ded;
    return 0;
  }
  // 연금소득만 있는 사람의 종합과세 세액(지방세 포함, 추정)
  function comprehensivePensionTax(pensionIncome) {
    const base = pensionIncome - pensionIncomeDeduction(pensionIncome) - RULES.basicDeduction;
    return progressiveTax(base) * 1.1;
  }
  function ageRate(age, lifelong) {
    if (lifelong) return 0.033; // 종신형: 2026년부터 연령 무관 일괄 3%(+지방세)
    for (const [a, r] of RULES.pensionAgeRates) if (age >= a) return r;
    return RULES.otherIncomeRate;
  }
  function creditRate(member) {
    return member && member.salaryBand === 'under' ? RULES.creditRateUnder : RULES.creditRateOver;
  }

  /* ---------- 납입 분류 (세액공제분 자동 판정) ---------- */
  // deposits: {accountId, date, amount, kind: personal|noncredit|retire|isaTransfer}
  // 반환: depositId -> {credit, noncredit, retire} , 연도·사람별 공제 요약
  function classifyDeposits(accounts, deposits, members) {
    const accById = Object.fromEntries(accounts.map(a => [a.id, a]));
    const out = {};
    const yearly = {}; // `${owner}|${year}` -> summary
    const key = (o, y) => o + '|' + y;
    const groups = {};
    for (const d of deposits) {
      const a = accById[d.accountId];
      if (!a) continue;
      const y = yearOf(d.date);
      const k = key(a.owner, y);
      (groups[k] = groups[k] || []).push(d);
    }
    for (const [k, list] of Object.entries(groups)) {
      const [owner, yStr] = k.split('|');
      const member = members.find(m => m.id === owner);
      let P = 0, I = 0, T = 0;
      for (const d of list) {
        const a = accById[d.accountId];
        if (!isPension(a)) continue;
        if (d.kind === 'personal') { if (a.type === 'pension') P += d.amount; else I += d.amount; }
        if (d.kind === 'isaTransfer') T += d.amount;
      }
      const creditP = Math.min(P, RULES.pensionCreditCap);
      const creditI = Math.min(I, Math.max(0, RULES.totalCreditCap - creditP));
      const creditT = Math.min(T * RULES.isaTransferCreditRate, RULES.isaTransferCreditCap);
      const ratioP = P ? creditP / P : 0, ratioI = I ? creditI / I : 0, ratioT = T ? creditT / T : 0;
      for (const d of list) {
        const a = accById[d.accountId];
        const c = { credit: 0, noncredit: 0, retire: 0 };
        if (!isPension(a)) { c.noncredit = d.amount; }
        else if (d.kind === 'retire') c.retire = d.amount;
        else if (d.kind === 'noncredit') c.noncredit = d.amount;
        else {
          const ratio = d.kind === 'isaTransfer' ? ratioT : a.type === 'pension' ? ratioP : ratioI;
          c.credit = d.amount * ratio; c.noncredit = d.amount - c.credit;
        }
        out[d.id] = c;
      }
      const credited = creditP + creditI + creditT;
      yearly[k] = {
        owner, year: +yStr, pensionPaid: P, irpPaid: I, isaTransfer: T,
        creditP, creditI, creditT, credited,
        rate: creditRate(member), refund: credited * creditRate(member),
        remainPension: Math.max(0, RULES.pensionCreditCap - P),
        remainTotal: Math.max(0, RULES.totalCreditCap - (creditP + creditI)),
        overDepositCap: P + I > RULES.annualDepositCap
      };
    }
    return { byDeposit: out, yearly };
  }

  /* ---------- 계좌 평가 (거래 → 보유·현금) ---------- */
  // trades: {accountId, date, type: buy|sell|dividend|fee|withdraw|interest, code, qty, price, amount}
  function accountPosition(acc, deposits, trades, products) {
    const priceOf = Object.fromEntries((products || []).map(p => [p.code, p]));
    const hold = {};
    let cash = sum(deposits.filter(d => d.accountId === acc.id), d => d.amount);
    let realized = 0, dividends = 0;
    const list = trades.filter(t => t.accountId === acc.id).sort((a, b) => (a.date < b.date ? -1 : 1));
    for (const t of list) {
      const amt = t.amount != null && t.amount !== '' ? +t.amount : (+t.qty || 0) * (+t.price || 0);
      if (t.type === 'buy') {
        const h = hold[t.code] = hold[t.code] || { qty: 0, cost: 0 };
        h.qty += +t.qty; h.cost += amt; cash -= amt;
      } else if (t.type === 'sell') {
        const h = hold[t.code] = hold[t.code] || { qty: 0, cost: 0 };
        const avg = h.qty ? h.cost / h.qty : 0;
        const q = +t.qty;
        realized += amt - avg * q;
        h.cost -= avg * q; h.qty -= q; cash += amt;
      } else if (t.type === 'dividend' || t.type === 'interest') { cash += amt; dividends += amt; }
      else if (t.type === 'fee' || t.type === 'withdraw') cash -= amt;
    }
    const holdings = Object.entries(hold).filter(([, h]) => h.qty > 1e-9).map(([code, h]) => {
      const p = priceOf[code];
      const price = p && p.price ? +p.price : (h.qty ? h.cost / h.qty : 0);
      const value = price * h.qty;
      return { code, name: p ? p.name : code, qty: h.qty, avg: h.cost / h.qty, cost: h.cost, price, value,
               pnl: value - h.cost, assetClass: p ? p.assetClass : 'risky' };
    });
    const computed = sum(holdings, h => h.value) + cash;
    const reported = acc.reportedValue != null && acc.reportedValue !== '' ? +acc.reportedValue : null;
    const value = reported != null ? reported : computed;
    const riskyShare = computed > 0 ? sum(holdings.filter(h => h.assetClass !== 'safe'), h => h.value) / computed : 0;
    return { holdings, cash, computed, reported, value, diff: reported != null ? reported - computed : 0,
             realized, dividends, riskyShare };
  }

  function principalOf(acc, deposits, classified) {
    const p = { credit: 0, noncredit: 0, retire: 0 };
    for (const d of deposits) {
      if (d.accountId !== acc.id) continue;
      const c = classified.byDeposit[d.id];
      if (!c) continue;
      p.credit += c.credit; p.noncredit += c.noncredit; p.retire += c.retire;
    }
    p.total = p.credit + p.noncredit + p.retire;
    return p;
  }

  /* ---------- 연금수령 자격·한도 ---------- */
  function firstEligibleYear(acc, member, hasRetire) {
    const byAge = member.birthYear + RULES.minAge;
    const opened = yearOf(acc.openedAt) || RULES.year;
    return hasRetire ? Math.max(byAge, opened) : Math.max(byAge, opened + RULES.minYears);
  }
  function withdrawalLimit(valueAtStart, n) {
    if (n <= 0) return 0;
    if (n >= 11) return Infinity;
    return (valueAtStart / (11 - n)) * 1.2;
  }


  // 목돈 일정이 걸리는 연도들 (month 'YYYY-MM', repeat 매년, until 'YYYY-MM')
  function lumpYears(l) {
    const y0 = yearOf(l.month); if (!y0) return [];
    if (!l.repeat) return [y0];
    const y1 = yearOf(l.until) || y0 + 60; const out = [];
    for (let y = y0; y <= y1; y++) out.push(y);
    return out;
  }
  // 생활비: 기본값 → 시작 연도가 지난 마지막 구간
  function monthlyNeedAt(sim, y) {
    let v = +sim.monthlyNeed || 0;
    for (const p of (sim.spendPhases || []).slice().sort((a, b) => a.fromYear - b.fromYear)) if (+p.fromYear <= y) v = +p.monthly || 0;
    return v;
  }

  /* ---------- 시뮬레이션 ---------- */
  const STRATEGIES = {
    cap1500: { label: '1,500만 맞춤', desc: '연금을 1인당 과세대상 1,500만원까지 먼저 받고, 부족분은 ISA·일반자산에서' },
    pensionFirst: { label: '연금 먼저', desc: '연금계좌를 한도까지 먼저 쓰고 ISA·일반자산은 나중에' },
    isaFirst: { label: 'ISA·일반 먼저', desc: 'ISA·일반자산을 먼저 쓰고 연금은 최대한 늦게' }
  };

  function initSimState(state, classified) {
    const members = state.profile.members;
    const accs = [];
    for (const a of state.accounts) {
      if (a.closed) continue;
      const pos = accountPosition(a, state.deposits, state.trades, state.products);
      const member = members.find(m => m.id === a.owner) || members[0];
      const s = { id: a.id, name: a.name, type: a.type, owner: member.id, member, acc: a,
                  planned: +a.plannedAnnual || 0, lifelong: !!a.lifelong };
      if (isPension(a)) {
        const p = principalOf(a, state.deposits, classified);
        let noncredit = p.noncredit, retire = p.retire;
        let T = pos.value - noncredit - retire;
        if (T < 0) { noncredit = Math.max(0, noncredit + T); T = 0; }
        Object.assign(s, { noncredit, retire, T, retireRate: (+a.retireTaxRate || 0) / 100,
          eligible: firstEligibleYear(a, member, retire > 0) });
      } else if (a.type === 'isa') {
        const principal = sum(state.deposits.filter(d => d.accountId === a.id), d => d.amount);
        Object.assign(s, { principal: Math.min(principal, pos.value), gain: Math.max(0, pos.value - principal),
          loss: Math.min(0, pos.value - principal),
          taxFree: RULES.isaTaxFree[a.isaKind === 'low' ? 'low' : 'normal'], freeUsed: 0,
          maturity: yearOf(a.isaMaturity), toPension: a.isaToPension || '' });
      } else {
        s.value = pos.value;
      }
      accs.push(s);
    }
    if (!accs.some(s => s.type === 'general')) {
      accs.push({ id: '__cash', name: '일반자산', type: 'general', owner: members[0].id, member: members[0], value: 0, planned: 0 });
    }
    return accs;
  }
  const valueOf = s => isPension(s) ? s.noncredit + s.retire + s.T : s.type === 'isa' ? s.principal + s.gain : s.value;

  function simulate(state, strategyKey, opts) {
    opts = opts || {};
    const sim = state.profile.sim;
    const members = state.profile.members;
    const baseYear = opts.baseYear || RULES.year;
    // 미래 날짜 납입(퇴직수당·매각대금 등)은 해당 연도에 투입
    const nowDeposits = state.deposits.filter(d => (yearOf(d.date) || 0) <= baseYear);
    const futureDeposits = state.deposits.filter(d => (yearOf(d.date) || 0) > baseYear);
    const stateNow = Object.assign({}, state, { deposits: nowDeposits });
    const classified = classifyDeposits(state.accounts, nowDeposits, members);
    const accs = initSimState(stateNow, classified);
    const r = +sim.returnRate / 100, inf = +sim.inflation / 100;
    const endYear = Math.max(...members.map(m => m.birthYear + (+sim.endAge || 90)));
    const rows = [];
    let totalTax = 0, totalRefund = 0, depletedYear = null, totalShort = 0, totalHI = 0;
    const firstT = {}; // 실제 수령 시작연도 (퇴직소득 감면 연차용)

    for (let y = baseYear + 1; y <= endYear; y++) {
      const row = { year: y, ages: Object.fromEntries(members.map(m => [m.id, y - m.birthYear])),
                    draws: {}, tax: 0, refund: 0, need: 0, publicGross: 0, other: 0, short: 0, notes: [] };

      // ISA 만기 처리
      for (const s of accs) {
        if (s.type !== 'isa' || !s.maturity || s.maturity !== y || s.matured) continue;
        s.matured = true;
        if (s.principal + s.gain <= 0) { s.maturity = y + 3; s.matured = false; s.freeUsed = 0; continue; }
        const taxable = Math.max(0, s.gain + s.loss - s.taxFree);
        const t = taxable * RULES.isaRate;
        const net = s.principal + s.gain - t;
        row.tax += t; totalTax += t;
        const target = accs.find(x => x.id === s.toPension);
        if (target && net > 0 && y < +sim.startYear) {
          const credit = Math.min(net * RULES.isaTransferCreditRate, RULES.isaTransferCreditCap);
          target.T += credit; target.noncredit += net - credit;
          if (y < +sim.startYear) { const rf = credit * creditRate(target.member); row.refund += rf; totalRefund += rf; }
          // 이전 후 새 ISA 재가입(3년 주기) 가정
          s.principal = 0; s.gain = 0; s.loss = 0; s.freeUsed = 0;
          s.maturity = y + 3; s.matured = false;
          row.notes.push(`${s.name} 만기 → ${target.name} 이전(추가공제 ${fmtMan(credit)})`);
        } else {
          // 만기 후 재가입 가정: 원금 재설정(세후 금액), 비과세 한도 새로 적용
          s.principal = net; s.gain = 0; s.loss = 0; s.freeUsed = 0;
          s.maturity = y + 3; s.matured = false;
          row.notes.push(`${s.name} 만기 정산·재가입`);
        }
      }

      for (const d of futureDeposits) {
        if (yearOf(d.date) !== y) continue;
        const s = accs.find(x => x.id === d.accountId);
        if (!s) continue;
        if (isPension(s)) {
          if (d.kind === 'retire') s.retire += d.amount;
          else if (d.kind === 'personal') {
            const c = Math.min(d.amount, s.type === 'pension' ? RULES.pensionCreditCap : RULES.totalCreditCap);
            s.T += c; s.noncredit += d.amount - c;
          } else s.noncredit += d.amount;
        } else if (s.type === 'isa') s.principal += d.amount;
        else s.value += d.amount;
        row.notes.push(`${s.name} ${fmtMan(d.amount)} 입금`);
      }

      const infl = Math.pow(1 + inf, y - baseYear);
      // 목돈 일정 (현재가치): +는 계좌로 입금, −는 그해 필요액에 더함
      let lumpOut = 0;
      for (const l of (sim.lumps || [])) {
        const hits = lumpYears(l).includes(y);
        if (!hits) continue;
        const amt = (+l.amount || 0) * infl;
        if (amt < 0) { lumpOut += -amt; row.notes.push(`${l.name || '지출'} ${fmtMan(amt)}`); continue; }
        const s = accs.find(x => x.id === l.to) || accs.find(x => x.type === 'general');
        if (!s) continue;
        if (isPension(s)) { if (l.kind === 'retire') s.retire += amt; else s.noncredit += amt; }
        else if (s.type === 'isa') s.principal += amt;
        else s.value += amt;
        row.notes.push(`${l.name || '입금'} +${fmtMan(amt)} → ${s.name}`);
      }

      const retired = y >= +sim.startYear;
      const publicByMember = {}, npsByMember = {};
      let rentIncome = 0;
      for (const m of members) { publicByMember[m.id] = 0; npsByMember[m.id] = 0; }
      row.npsGross = 0; row.hi = 0;
      // 퇴직 전후 연금계좌 추가 납입: 일반자산 → 연금계좌 비공제 원금 (연 1,800만 한도에서 계획 납입분 제외)
      const xd = sim.extraDeposit;
      if (xd && xd.on && xd.to && y >= +xd.startYear && y < +xd.startYear + (+xd.years || 1)) {
        const target = accs.find(a => a.id === xd.to && isPension(a));
        if (target) {
          const plannedSame = y < +sim.startYear ? sum(accs.filter(a => isPension(a) && a.owner === target.owner), a => a.planned || 0) : 0;
          let want = Math.min(+xd.amount || 0, Math.max(0, RULES.yearlyDepositCap - plannedSame));
          let moved = 0;
          for (const g of accs.filter(a => a.type === 'general')) { const t = Math.min(g.value, want - moved); g.value -= t; moved += t; if (moved >= want) break; }
          if (moved > 0) { target.noncredit += moved; row.notes.push(`${target.name}에 ${fmtMan(moved)} 추가 납입(비공제)`); }
        }
      }
      if (!retired) {
        // 적립기: 계획 납입 → 공제
        const byOwner = {};
        for (const s of accs) {
          if (!s.planned) continue;
          if (isPension(s)) {
            const o = byOwner[s.owner] = byOwner[s.owner] || { P: [], I: [] };
            (s.type === 'pension' ? o.P : o.I).push(s);
          } else if (s.type === 'isa') { s.principal += Math.min(s.planned, RULES.isaAnnualCap); }
          else s.value += s.planned;
        }
        for (const [owner, o] of Object.entries(byOwner)) {
          const m = members.find(x => x.id === owner);
          const P = sum(o.P, s => s.planned), I = sum(o.I, s => s.planned);
          const cP = Math.min(P, RULES.pensionCreditCap), cI = Math.min(I, Math.max(0, RULES.totalCreditCap - cP));
          for (const s of o.P) { const c = P ? s.planned * cP / P : 0; s.T += c; s.noncredit += s.planned - c; }
          for (const s of o.I) { const c = I ? s.planned * cI / I : 0; s.T += c; s.noncredit += s.planned - c; }
          const rf = (cP + cI) * creditRate(m); row.refund += rf; totalRefund += rf;
        }
        row.need = lumpOut;
      } else {
        row.need = monthlyNeedAt(sim, y) * 12 * infl + lumpOut;
        row.other = (+sim.otherMonthly || 0) * 12 * infl;
        for (const inc of (sim.incomes || [])) {
          if (!(y >= (+inc.startYear || 0) && y <= +(inc.endYear || 9999))) continue;
          const amt = (+inc.monthly || 0) * 12 * infl;
          if (inc.kind === 'nps') { const o = members.find(m => m.id === inc.owner) ? inc.owner : members[0].id; npsByMember[o] = (npsByMember[o] || 0) + amt; row.npsGross += amt; }
          else { row.other += amt; if (inc.kind === 'rent') rentIncome += amt; }
        }
        for (const m of members) {
          const pp = m.publicPension || {};
          if (pp.monthly && y >= +pp.startYear) {
            const g = +pp.monthly * 12 * infl;   // 현재가치 입력 → 물가 반영
            publicByMember[m.id] = g; row.publicGross += g;
          }
        }
      }
      row.publicGross += row.npsGross;
      // 지역 건강보험료 (은퇴 후): 공적연금 절반 + 금융소득(1,000만 초과 시 전액) + 임대·사업소득 + 재산분
      if (retired && sim.hiOn !== false) {
        const yieldR = (sim.generalYield != null ? +sim.generalYield : 2) / 100;
        const finBy = {}; let fin = 0;
        for (const g of accs.filter(a => a.type === 'general')) { const v = g.value * yieldR; finBy[g.owner] = (finBy[g.owner] || 0) + v; fin += v; }
        const pubAll = sum(members, m => publicByMember[m.id] + npsByMember[m.id]);
        const overDep = members.some(m => publicByMember[m.id] + npsByMember[m.id] + (finBy[m.id] || 0) + (m.id === members[0].id ? rentIncome : 0) > RULES.hiDependentLimit);
        if (overDep) {
          const base = pubAll * RULES.hiPublicShare + (fin > RULES.hiFinThreshold ? fin : 0) + rentIncome;
          row.hi = base * (RULES.hiRate + RULES.ltcRate) + (+sim.propertyHI || 0) * 12 * infl;
          row.hiFin = fin;
        }
        totalHI += row.hi;
      }
      const taxablePub = {};
      for (const m of members) {
        const ratio = (m.publicPension && m.publicPension.taxableRatio != null) ? +m.publicPension.taxableRatio / 100 : 1;
        taxablePub[m.id] = publicByMember[m.id] * ratio + npsByMember[m.id];
      }
      if (row.need > 0 || row.publicGross > 0) {
        // 연초 평가액 기준 수령한도
        for (const s of accs) {
          if (!isPension(s)) continue;
          const n = y - s.eligible + 1;
          s.n = n;
          s.limitLeft = withdrawalLimit(valueOf(s), n);
          if (n >= 1 && valueOf(s) > 0 && !firstT[s.id]) firstT[s.id] = y;
        }
        const result = drawForYear(accs, members, row, taxablePub, strategyKey, firstT, y);
        row.tax += result.tax; totalTax += result.tax;
        row.short = result.short; totalShort += result.short;
        if (result.short > 1 && depletedYear == null) depletedYear = y;
        Object.assign(row, { draws: result.draws, privateT: result.privateT, choice: result.choice,
                             publicTax: result.publicTax });
      }
      // 성장
      for (const s of accs) {
        if (isPension(s)) s.T += (s.noncredit + s.retire + s.T) * r;
        else if (s.type === 'isa') s.gain += (s.principal + s.gain) * r;
        else s.value *= 1 + r;
      }
      row.balance = sum(accs, valueOf);
      row.balanceReal = row.balance / Math.pow(1 + inf, y - baseYear);
      row.byAccount = Object.fromEntries(accs.map(s => [s.id, valueOf(s)]));
      rows.push(row);
    }
    return { strategy: strategyKey, rows, totalTax, totalRefund, depletedYear, totalShort, totalHI,
             endBalance: rows.length ? rows[rows.length - 1].balance : 0,
             endBalanceReal: rows.length ? rows[rows.length - 1].balanceReal : 0 };
  }

  // 한 해 인출: 필요 순액을 맞출 때까지 전략 순서대로 인출, 1,500만 초과 시 정산세 재반영
  function drawForYear(accs, members, row, taxablePub, strategyKey, firstT, y) {
    const snapshot = accs.map(s => ({ ...s }));
    let extra = 0, res;
    for (let iter = 0; iter < 4; iter++) {
      // 상태 복원
      snapshot.forEach((s, i) => Object.assign(accs[i], s));
      // 공적연금 세금(단독 종합과세) — 사적연금 정산 전
      let publicTax = 0;
      for (const m of members) publicTax += comprehensivePensionTax(taxablePub[m.id] || 0);
      const gap = Math.max(0, row.need + (row.hi || 0) - (row.publicGross - publicTax) - row.other) + extra;
      res = runDraws(accs, members, gap, strategyKey, firstT, y);
      // 1인당 사적연금 과세대상 정산
      let settle = 0; const choice = {};
      for (const m of members) {
        const pt = res.privateT[m.id] || 0;
        const pub = taxablePub[m.id] || 0;
        const withheld = res.withheldT[m.id] || 0;
        const base = comprehensivePensionTax(pub);
        const comp = comprehensivePensionTax(pub + pt) - base;
        let chosen, label;
        if (pt <= RULES.privatePensionThreshold) {
          if (comp < withheld) { chosen = comp; label = '종합'; } else { chosen = withheld; label = '저율분리'; }
        } else {
          const sep = pt * RULES.otherIncomeRate;
          if (comp < sep) { chosen = comp; label = '종합'; } else { chosen = sep; label = '16.5%분리'; }
        }
        choice[m.id] = label;
        settle += chosen - withheld;
      }
      res.publicTax = publicTax;
      res.choice = choice;
      res.tax = res.drawTax + publicTax + settle;
      const newExtra = Math.max(0, settle);
      if (Math.abs(newExtra - extra) < 1000) { extra = newExtra; break; }
      extra = newExtra;
    }
    return res;
  }

  function runDraws(accs, members, gap, strategyKey, firstT, y) {
    let need = gap, drawTax = 0;
    const draws = {}, privateT = {}, withheldT = {};
    const add = (s, g) => { draws[s.id] = (draws[s.id] || 0) + g; };
    const pens = accs.filter(isPension);
    const isas = accs.filter(s => s.type === 'isa');
    const gens = accs.filter(s => s.type === 'general');

    // 연금계좌 인출 (mode: limit | over), capT: 1인당 T 상한(1500 전략)
    function fromPension(s, mode, capT) {
      if (need <= 0) return;
      const age = y - s.member.birthYear;
      const inLimit = mode === 'limit';
      if (inLimit && (s.n < 1)) return;
      const chunks = [];
      const n = y - (firstT[s.id] || y) + 1;
      const retireRate = inLimit ? s.retireRate * RULES.retireFactor(n) : s.retireRate;
      chunks.push(['noncredit', 0]);
      chunks.push(['retire', retireRate]);
      chunks.push(['T', inLimit ? ageRate(age, s.lifelong) : RULES.otherIncomeRate]);
      for (const [pool, rate] of chunks) {
        if (need <= 0) break;
        let avail = s[pool];
        if (inLimit) avail = Math.min(avail, s.limitLeft);
        if (pool === 'T' && inLimit && capT != null) avail = Math.min(avail, Math.max(0, capT - (privateT[s.owner] || 0)));
        if (avail <= 0) continue;
        const gross = Math.min(avail, need / (1 - rate));
        const tax = gross * rate;
        s[pool] -= gross; if (inLimit) s.limitLeft -= gross;
        need -= gross - tax; drawTax += tax; add(s, gross);
        if (pool === 'T' && inLimit) {
          privateT[s.owner] = (privateT[s.owner] || 0) + gross;
          withheldT[s.owner] = (withheldT[s.owner] || 0) + tax;
        }
      }
    }
    function fromIsa(s) {
      if (need <= 0) return;
      let g = Math.min(s.principal, need);
      s.principal -= g; need -= g; add(s, g);
      if (need <= 0 || s.gain <= 0) return;
      const freeLeft = Math.max(0, s.taxFree - (s.freeUsed || 0));
      g = Math.min(s.gain, freeLeft, need);
      s.gain -= g; s.freeUsed = (s.freeUsed || 0) + g; need -= g; add(s, g);
      if (need <= 0 || s.gain <= 0) return;
      g = Math.min(s.gain, need / (1 - RULES.isaRate));
      const t = g * RULES.isaRate;
      s.gain -= g; need -= g - t; drawTax += t; add(s, g);
    }
    function fromGen(s) {
      if (need <= 0) return;
      const g = Math.min(s.value, need);
      s.value -= g; need -= g; add(s, g);
    }
    const allPension = (mode, cap) => pens.forEach(s => fromPension(s, mode, cap));
    const allIsa = () => isas.forEach(fromIsa);
    const allGen = () => gens.forEach(fromGen);

    if (strategyKey === 'isaFirst') { allIsa(); allGen(); allPension('limit'); allPension('over'); }
    else if (strategyKey === 'pensionFirst') { allPension('limit'); allIsa(); allGen(); allPension('over'); }
    else { // cap1500
      // 퇴직금·비공제 원금은 1,500만 판정과 무관 → 한도 안에서 먼저, 과세분은 1인당 1,500만까지
      allPension('limit', RULES.privatePensionThreshold);
      allIsa(); allGen(); allPension('limit'); allPension('over');
    }
    return { draws, drawTax, privateT, withheldT, short: Math.max(0, need) };
  }

  function compareStrategies(state, opts) {
    return Object.keys(STRATEGIES).map(k => simulate(state, k, opts));
  }

  /* ---------- 알림 ---------- */
  function alerts(state, year) {
    const out = [];
    const members = state.profile.members;
    const cls = classifyDeposits(state.accounts, state.deposits, members);
    for (const m of members) {
      const s = cls.yearly[m.id + '|' + year];
      const paidP = s ? s.pensionPaid : 0, paidI = s ? s.irpPaid : 0;
      const remain = s ? s.remainTotal : RULES.totalCreditCap;
      if (s && s.overDepositCap) out.push({ level: 'warn', text: `${m.name}: 연금저축+IRP 연 납입한도 1,800만원 초과` });
    }
    for (const a of state.accounts) {
      if (a.closed) continue;
      if (a.type === 'isa' && a.isaMaturity) {
        const y = yearOf(a.isaMaturity);
        if (y - year <= 1 && y >= year) out.push({ level: 'warn', text: `${a.name}: ${a.isaMaturity} 만기 — 만기 후 60일 안에 연금계좌로 옮기면 추가 세액공제(최대 300만원)` });
      }
      if ((a.type === 'pension' || a.type === 'irp' || a.type === 'isa') && !a.openedAt) {
        out.push({ level: 'warn', text: `${a.name}: 개설일을 입력하세요 (연금 수령 시기·ISA 만기 계산에 필요)` });
      }

})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function(){

{ let h = (location.hash || '').slice(1); if(h === 'draw') h = 'plan'; if(['home','acc','tax','plan','set'].includes(h)) ui.tab = h; }

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}
function eok(x){ // 큰 금액: 1.23억

/* ---------- 레이아웃 ---------- */

  draw:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
const TABS = [['home','홈','home'],['acc','계좌','acc'],['tax','절세','tax'],['plan','은퇴설계','draw']];   // 설정은 ⋮ 메뉴

// 접기 영역 열림 상태 기억 (다시 그려도 유지)
document.addEventListener('toggle', e => { const d = e.target; if(d.tagName==='DETAILS' && d.dataset.key) ui.open[d.dataset.key] = d.open; }, true);
const fold = (key, title, body, meta) => `<details class="fold" data-key="${key}" ${ui.open[key]?'open':''}><summary>${title}${meta?` <span class="meta">${meta}</span>`:''}</summary><div class="body">${body}</div></details>`;

function numIn(el){ const v = parseFloat(String(el.value).replace(/,/g,'')); if(!isFinite(v)) return 0; return el.dataset.num==='man' ? Math.round(v*10000) : v; }
function setPath(o, path, v){ const ks = path.split('.'); let c=o; for(let i=0;i<ks.length-1;i++){ c = c[isNaN(ks[i])?ks[i]:+ks[i]]; } c[ks[ks.length-1]] = v; }

/* ---------- 홈: 5초 안에 세 가지 — 자산이 얼마? 올해 혜택은? 은퇴 후 충분한가? ---------- */
const TYPE_COLOR = { pension:'var(--p-credit)', irp:'var(--p-retire)', isa:'var(--s3)', general:'var(--p-non)' };
function principalSum(a){ return S.deposits.filter(d=>d.accountId===a.id && (E.yearOf(d.date)||0) <= THIS_YEAR).reduce((s,d)=>s+d.amount,0); }
function refundSummary(year){
  const cls = E.classifyDeposits(S.accounts, S.deposits, S.profile.members);
  const ms = S.profile.members.filter(m => ui.owner==='all' || m.id===ui.owner);

    const y = cls.yearly[m.id+'|'+year] || { refund:0, remainTotal:E.RULES.totalCreditCap, pensionPaid:0, irpPaid:0, credited:0, rate:E.creditRate(m) };
    refund += y.refund; remain += y.remainTotal; remainRefund += y.remainTotal * (y.rate || E.creditRate(m));

  }
  return { refund, remain, remainRefund, paidP, paidI, credited, ms, cls };
}
function renderHome(){
  const accs = visibleAccounts();
  if(!S.accounts.length) return `<div class="card"><h2>시작하기</h2>

      <div class="sub">${okRet?`잔액 ${eok(best.endBalanceReal)} (현재가치)`:esc(ageStr(best.depletedYear))}</div></div>
  </div>
  ${al.length?`<div class="card">${al.slice(0,3).map(x=>`<div class="alert warn"><b>!</b><span>${esc(x.text)}</span></div>`).join('')}${al.length>3?`<div class="more">외 ${al.length-3}건</div>`:''}</div>`:''}

  }
  const infoForm = `<div class="card" style="margin-top:${isNew?4:0}px">

    ${isNew ? infoForm : summary}

function yearTable(r){

    return `<tr><td>${x.year}</td><td>${ages}</td><td>${x.need?man(x.need):'적립'}</td><td>${x.publicGross?man(x.publicGross):''}</td>
      ${accs.map(a=>`<td>${x.draws[a.id]?man(x.draws[a.id]):''}</td>`).join('')}
      <td>${x.tax?man(x.tax):''}</td><td>${x.hi?man(x.hi):''}</td><td class="${x.short>1?'neg':''}">${x.short>1?man(x.short):''}</td><td>${eok(x.balance)}</td></tr>`
      + (x.notes.length?`<tr><td></td> <td colspan="${accs.length+7}" style="text-align:left;color:var(--muted)">${esc(x.notes.join(' · '))}</td></tr>`:'');
  }).join('');

function chartSvg(sims){
  const W=640,H=240,L=46,R=10,T=10,B=26;
  const rows = sims[0].rows; if(!rows.length) return '';
  const x0=rows[0].year, x1=rows[rows.length-1].year;
  const maxV = Math.max(1, ...sims.flatMap(s=>s.rows.map(r=>r.balanceReal)));
  const nice = niceMax(maxV);
  const X = y => L + (y-x0)/(x1-x0||1)*(W-L-R);
  const Y = v => T + (1 - v/nice)*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){ const v=nice*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1e8?(v/1e8).toFixed(v%1e8?1:0)+'억':Math.round(v/1e4)+'만'}</text>`; }
  const step = Math.max(1, Math.round((x1-x0)/6));
  for(let y=x0;y<=x1;y+=step) g+=`<text x="${X(y)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${y}</text>`;
  const sy = +S.profile.sim.startYear;
  if(sy>x0 && sy<x1) g+=`<line x1="${X(sy)}" x2="${X(sy)}" y1="${T}" y2="${H-B}" stroke="var(--text-2)" stroke-dasharray="3 3"/><text x="${X(sy)+4}" y="${T+11}" font-size="11" fill="var(--text-2)">인출 시작</text>`;
  const lines = sims.map(s=>`<path d="${s.rows.map((r,i)=>(i?'L':'M')+X(r.year).toFixed(1)+' '+Y(r.balanceReal).toFixed(1)).join('')}" fill="none" stroke="${SCOLOR[s.strategy]}" stroke-width="2" stroke-linejoin="round"/>`).join('');
  return `<div class="chart" id="chart" data-x0="${x0}" data-x1="${x1}"><svg viewBox="0 0 ${W} ${H}">${g}${lines}<line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--text-2)" stroke-width="1" style="display:none"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div></div>`;
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(v<=m*p) return m*p; return 10*p; }
function bindChart(){
  const c = $('#chart'); if(!c || !lastSims) return;
  const svg = c.querySelector('svg'), tip=$('#tip'), cross=$('#cross');
  const x0=+c.dataset.x0, x1=+c.dataset.x1, W=640, L=46, R=10;
  const move = ev => {
    const pt = ev.touches?ev.touches[0]:ev; const rect=svg.getBoundingClientRect();
    const sx = (pt.clientX-rect.left)/rect.width*W;
    const y = Math.max(x0, Math.min(x1, Math.round(x0 + (sx-L)/(W-L-R)*(x1-x0))));
    const xp = L + (y-x0)/(x1-x0||1)*(W-L-R);
    cross.setAttribute('x1',xp); cross.setAttribute('x2',xp); cross.style.display='';
    const lines = lastSims.map(s=>{ const r=s.rows.find(q=>q.year===y); return `<div><span style="color:${SCOLOR[s.strategy]}">●</span> ${E.STRATEGIES[s.strategy].label} ${r?eok(r.balanceReal):''}</div>`; }).join('');
    tip.innerHTML = `<b>${y}년</b> · ${ageStr(y)}${lines}`; tip.style.display='block';
    const px = xp/W*rect.width; tip.style.left = Math.min(Math.max(0, px-tip.offsetWidth/2), rect.width-tip.offsetWidth)+'px'; tip.style.top='0px';
  };
  const out = () => { tip.style.display='none'; cross.style.display='none'; };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move, {passive:true}); svg.addEventListener('touchstart', move, {passive:true});
  svg.addEventListener('mouseleave', out); svg.addEventListener('touchend', () => setTimeout(out,1500));
}

/* ---------- 캐시플로우 불러오기 ---------- */
// 캐시플로우는 만원 단위, 구성원 키는 '본인'·'아내', 금액은 현재가치(실질) 기준
const CF_FIN = ['stock','pension','mutual','cash','other'];
const CF_CAT = { stock:'주식', pension:'연금계좌', mutual:'공제회·저축', cash:'현금·예금', other:'기타' };
let CF = null;   // 마지막으로 읽은 캐시플로우 데이터
const cfNum = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const cfYear = s => s ? parseInt(String(s).slice(0,4), 10) : null;
function cfOwnerToMember(owner){
  const ms = S.profile.members;
  if(owner === '본인') return ms[0] && ms[0].id;
  if(owner === '아내') return ms[1] && ms[1].id;
  return ms[0] && ms[0].id;
}
function cfSalaryMonthly(D, who){   // 급여 장부: 실수령 입력한 가장 최근 연도의 월 평균 + 수당 ÷ 12
  const years = Object.keys(D.salary || {}).map(Number).sort((a,b)=>b-a);
  for(const y of years){
    const P = (D.salary[y] || {})[who]; if(!P) continue;
    const ms = (P.months || []).map(v => Math.floor(cfNum(v)+1e-9)).filter(v => v > 0);
    if(!ms.length) continue;
    const autoOn = P.auto && cfNum(P.auto.base1) > 0;
    let ex = (P.extras || []).filter(e => !(autoOn && /^(명절휴가비|연가보상비)/.test(e.name))).reduce((s,e)=>s+Math.floor(cfNum(e.amount)+1e-9),0);
    if(autoOn){ const b = cfNum(P.auto.base2) || cfNum(P.auto.base1); ex += Math.floor(b*0.6)*2 + (cfNum(P.auto.days) ? Math.floor(b*0.86/30*cfNum(P.auto.days)) : 0); }
    return { monthly: ms.reduce((s,v)=>s+v,0)/ms.length + ex/12, year:y };
  }
  return null;
}
function cfRetireYear(D, who){
  const rel = who === '본인' ? '본인' : '배우자';
  const f = (D.family || []).find(x => x.rel === rel && x.birth);
  if(!f) return null;
  if(f.retire) return cfYear(f.retire);
  return +f.birth.slice(0,4) + 60;
}
function cfNick(D, key){ const m = (D.members || []).find(x => x.name === key); return m && m.nick ? m.nick : key; }

// 캐시플로우 데이터 → 반영할 항목 목록
function cfBuild(D, RB){
  const out = { members:[], publicPensions:[], incomes:[], lumps:[], spend:null, assets:[] };
  ['본인','아내'].forEach((key, i) => {
    const rel = i === 0 ? '본인' : '배우자';
    const f = (D.family || []).find(x => x.rel === rel && x.birth);
    if(f) out.members.push({ idx:i, name:cfNick(D, key), birthYear:cfYear(f.birth) });
  });
  for(const x of (D.incomes || [])){
    const mid = cfOwnerToMember(x.owner);
    if(/연금/.test(x.name || '') && !/국민연금/.test(x.name || '') && (x.owner === '본인' || x.owner === '아내') && x.start){   // 국민연금은 기간 수입(종류: 국민연금)으로
      out.publicPensions.push({ cfId:x.id, memberId:mid, idx:x.owner==='본인'?0:1, name:`${x.name} (${cfNick(D, x.owner)})`, monthly:Math.round(cfNum(x.monthly)*1e4), startYear:cfYear(x.start) });
      continue;
    }
    let monthly = cfNum(x.monthly), note = '';
    if(x.kind === 'salary'){ const l = cfSalaryMonthly(D, x.owner); if(l){ monthly = l.monthly; note = `급여 장부 ${l.year}년 월평균`; } }
    const endYear = x.end ? cfYear(x.end) : (x.kind === 'salary' ? cfRetireYear(D, x.owner) : null);
    out.incomes.push({ cfId:x.id, owner:cfOwnerToMember(x.owner), name:(x.name || '소득') + (x.owner ? ` (${cfNick(D, x.owner)})` : ''), monthly:Math.round(monthly*1e4),
      startYear:cfYear(x.start), endYear, note });
  }
  for(const l of (D.lumps || [])){
    if(l.done && !l.repeat) continue;
    out.lumps.push({ cfId:l.id, name:l.name || '목돈', amount:Math.round(cfNum(l.amount)*1e4), month:l.month, repeat:!!l.repeat, until:l.until || '' });
  }
  const sim = D.sim || {};
  if(sim.spendMode === 'expenses'){
    const at = cfYear(sim.lifeStart) || THIS_YEAR;
    const tot = (D.expenses || []).filter(e => e.cat !== 'saving' && (!e.start || cfYear(e.start) <= at) && (!e.end || cfYear(e.end) >= at)).reduce((s,e)=>s+cfNum(e.monthly),0);
    out.spend = { startYear:cfYear(sim.lifeStart), monthly:Math.round(tot*1e4), phases:[], note:'고정지출 목록 합계(생활비 시작 시점)' };
  } else {
    out.spend = { startYear:cfYear(sim.lifeStart), monthly:Math.round(cfNum(sim.spend)*1e4),
      phases:(sim.phases || []).filter(p => p.from).map(p => ({ fromYear:cfYear(p.from), monthly:Math.round(cfNum(p.monthly)*1e4) })), note:'' };
  }
  for(const a of (D.assets || [])){
    if(CF_FIN.indexOf(a.cat) < 0) continue;
    // 명의가 비었거나 '공동'이면 이름에 든 별명(혜진 등)이나 '아내'·'본인'으로 추정
    let owner = a.owner, ownerGuessed = false;
    if(!owner || owner === '공동'){
      for(const key of ['아내','본인']){ const nick = cfNick(D, key); if((nick && nick !== key && a.name.indexOf(nick) >= 0) || a.name.indexOf(key) >= 0){ owner = key; ownerGuessed = true; break; } }
    }
    // 리밸런서 납입원금: 캐시플로우의 리밸런서 연결(rbMap)로 이 자산에 묶인 계좌들의 원금 합계
    let principal = 0;
    if(RB && RB.accounts) for(const [rbName, cfId] of Object.entries(D.rbMap || {})){
      if(cfId !== a.id) continue;
      const ra = RB.accounts.find(x => x.name === rbName); if(!ra || !(+ra.principal > 0)) continue;
      principal += ra.market === 'US' ? +ra.principal * (RB.rate || 0) : +ra.principal;
    }
    out.assets.push({ cfId:a.id, name:a.name + (owner && owner !== '공동' ? ` (${cfNick(D, owner)})` : ''), cat:a.cat, acct:a.acct, rawName:a.name, value:Math.round(cfNum(a.value)*1e4), owner, ownerGuessed, principal:Math.round(principal), src:a.src || '' });
  }
  return out;
}
// 자산 연결 기본값
// 1) 캐시플로우 '계좌 종류'가 있으면 그것을 따름: 일반 → 일반자산, 연금저축·IRP·ISA → 같은 종류·명의 계좌(없으면 새로 만듦)
// 2) 없으면 이전 연결 → 같은 이름 계좌 → 이름으로 종류 추정 → 일반자산
const CF_NEW = { pension:'새 연금저축 계좌로 만들기', irp:'새 IRP 계좌로 만들기', isa:'새 ISA 계좌로 만들기' };
const cfGuessType = n => /IRP|퇴직|DC/i.test(n) ? 'irp' : /ISA/i.test(n) ? 'isa' : /연금/.test(n) ? 'pension' : '';
const normName = n => String(n||'').replace(/\s*\(.*\)$/,'').replace(/\s/g,'');
function cfDefaultMaps(assets){
  const saved = (S.cf && S.cf.map) || {}, claimed = new Set(), out = [];
  const live = S.accounts.filter(a => !a.closed && a.type !== 'general');
  const pick = (asset, type) => {
    const owner = cfOwnerToMember(asset.owner);
    const prev = saved[asset.cfId]; const pa = live.find(a => a.id === prev);
    if(pa && pa.type === type) return pa.id;
    const byName = live.find(a => a.type === type && normName(a.name) === normName(asset.rawName) && !claimed.has(a.id));
    if(byName) return byName.id;
    const cands = live.filter(a => a.type === type && a.owner === owner && !claimed.has(a.id) && !Object.values(saved).includes(a.id));
    if(cands.length === 1) return cands[0].id;
    return 'new:' + type;
  };
  for(const asset of assets){
    let v;
    if(asset.acct != null){ v = asset.acct ? pick(asset, asset.acct) : 'general'; }
    else {
      const prev = saved[asset.cfId], guess = cfGuessType(asset.rawName);
      if(prev != null && !(prev === 'general' && guess)) v = prev;              // 연금 이름인데 일반자산으로 묶였던 것은 다시 제안
      else if(guess) v = pick(asset, guess);
      else v = 'general';
    }
    if(v && !v.startsWith('new:') && v !== 'general') claimed.add(v);
    out.push(v);
  }
  return out;
}
// 리밸런서(로그인한 사람 것) 계좌 목록 — 원금용. 없거나 실패하면 null
async function rbFetch(){
  try{
    const r = await sb.from('rebalancer_data').select('accounts,history').eq('user_id', _user.id).maybeSingle();
    if(r.error || !r.data) return null;
    const h = r.data.history || {}, last = Object.keys(h).sort().pop();
    return { accounts:r.data.accounts || [], rate: last && h[last].rate ? +h[last].rate : 0 };
  }catch(e){ return null; }
}
// 연결된 계좌에 평가액·원금·명의 반영 (불러오기·자동 반영 공용)
function cfApplyAccounts(items, map, date){
  const sums = {}, prins = {}, owners = {}, msgs = [];
  items.forEach(a => { const v = map[a.cfId]; if(!v) return; sums[v] = (sums[v]||0) + a.value; prins[v] = (prins[v]||0) + (a.principal||0);
    if(a.owner === '본인' || a.owner === '아내') (owners[v] = owners[v] || new Set()).add(a.owner); });
  for(const [id, v] of Object.entries(sums)){
    const acc = id === 'general' ? S.accounts.find(a => a.cfGeneral) : S.accounts.find(a => a.id === id);
    if(!acc) continue;
    if(acc.reportedValue !== v){
      msgs.push(`${acc.name} ${man(acc.reportedValue||0)}→${man(v)}`);
      acc.reportedValue = v; acc.valueDate = date; acc.valueSrc = 'cf';
      acc.history = (acc.history || []).filter(h => h.date !== date); acc.history.push({ date, value:v });
    }
    if(prins[id] > 0) acc.principalRB = prins[id];
    // 명의: 직접 고친 계좌는 건드리지 않음, 연결된 자산의 명의가 하나로 정해질 때만
    const os = owners[id];
    if(id !== 'general' && acc.ownerSrc !== 'manual' && os && os.size === 1){
      const mid = cfOwnerToMember([...os][0]);
      if(mid && acc.owner !== mid){ msgs.push(`${acc.name} 명의 → ${memberById(mid).name}`); acc.owner = mid; }
    }
  }
  return { sums, msgs };
}

    ${sec('inc','기간 수입', it.incomes.length, it.incomes.map(x=>`<div class="row"><span class="k">${esc(x.name)}${x.note?`<div class="meta">${esc(x.note)}</div>`:''}</span><span class="v">월 ${man(x.monthly)} · ${x.startYear||'지금'}~${x.endYear||''}</span></div>`).join('') + '<p class="note">은퇴(인출 시작) 이후 기간만 계산에 쓰입니다.</p>')}

      ${it.spend.note?`<p class="note">${esc(it.spend.note)}</p>`:''}` : '')}
    ${sec('assets','자산 평가액 → 계좌 연결', it.assets.length, it.assets.map((a,i)=>`<label class="f"><span>${esc(a.name)} · ${CF_CAT[a.cat]} · <b>${man(a.value)}</b></span><select id="cfm_${i}">${accOpts(defs[i])}</select>${a.acct?`<span class="meta">캐시플로우 계좌 종류: ${({'':'일반',pension:'연금저축',irp:'IRP',isa:'ISA'})[a.acct]||a.acct}</span>`:''}</label>`).join('') +
      '<p class="note">같은 계좌에 연결한 자산은 합산합니다. 캐시플로우 자산 화면의 \'계좌 종류\'를 정해 두면 다음부터 자동으로 연결됩니다.</p>')}

function cfApply(){
  const it = CF.items, on = k => { const el = document.getElementById('cfk_'+k); return el && el.checked; };
  const sim = S.profile.sim, ms = S.profile.members;
  S.cf = S.cf || { map:{} }; S.cf.map = S.cf.map || {};
  if(on('members')) it.members.forEach(m => { if(ms[m.idx]){ ms[m.idx].birthYear = m.birthYear; if(/^(본인|배우자)$/.test(ms[m.idx].name)) ms[m.idx].name = m.name; } });
  if(on('pub')) it.publicPensions.forEach(p => { const m = ms[p.idx]; if(m){ m.publicPension = Object.assign({ taxableRatio:80 }, m.publicPension, { monthly:p.monthly, startYear:p.startYear, src:'cf' }); } });
  if(on('inc')){
    const prevInc = Object.fromEntries((sim.incomes || []).filter(x => x.src === 'cf').map(x => [x.cfId, x]));
    sim.incomes = (sim.incomes || []).filter(x => x.src !== 'cf').concat(it.incomes.map(x => { const p = prevInc[x.cfId] || {};
      return { id:p.id || uid('i'), src:'cf', cfId:x.cfId, name:x.name, monthly:x.monthly, startYear:x.startYear, endYear:x.endYear,
        kind: p.kind != null ? p.kind : (/국민연금/.test(x.name) ? 'nps' : /월세|임대|사업/.test(x.name) ? 'rent' : ''), owner: p.owner || x.owner }; }));
    if(sim.otherMonthly && confirm('기타 월수입(월세 등)을 직접 입력해 두셨습니다. 캐시플로우 수입과 겹치면 두 번 계산됩니다.\n기타 월수입을 0으로 바꿀까요?')) sim.otherMonthly = 0;
  }
  if(on('lump')){
    const prev = Object.fromEntries((sim.lumps || []).filter(x => x.src === 'cf').map(x => [x.cfId, x]));
    sim.lumps = (sim.lumps || []).filter(x => x.src !== 'cf').concat(it.lumps.map(x => {
      const p = prev[x.cfId] || {};   // 입금 계좌·퇴직금 표시는 이전 설정 유지
      return { id:p.id || uid('l'), src:'cf', cfId:x.cfId, name:x.name, amount:x.amount, month:x.month, repeat:x.repeat, until:x.until, to:p.to || '', kind:p.kind || '' };
    }));
  }
  if(on('spend') && it.spend){
    sim.monthlyNeed = it.spend.monthly; if(it.spend.startYear) sim.startYear = it.spend.startYear;
    sim.spendPhases = it.spend.phases; sim.spendSrc = 'cf';
  }
  if(on('assets')){
    const date = localDay();
    let made = 0;
    it.assets.forEach((a,i) => {
      let v = val('cfm_'+i);
      if(v.startsWith('new:')){
        const acc = { id:uid('a'), type:v.slice(4), owner:cfOwnerToMember(a.owner), ownerSrc:'cf', name:a.rawName, institution:'', openedAt:'', history:[], plannedAnnual:0, isaKind:'normal' };
        S.accounts.push(acc); v = acc.id; made++;
      }
      S.cf.map[a.cfId] = v;
    });
    if(it.assets.some(a => S.cf.map[a.cfId] === 'general') && !S.accounts.find(a => a.cfGeneral))
      S.accounts.push({ id:uid('a'), type:'general', owner:ms[0].id, name:'일반자산 (캐시플로우)', institution:'', history:[], cfGeneral:true });
    const res = cfApplyAccounts(it.assets, S.cf.map, date);
    const g = S.accounts.find(a => a.cfGeneral); if(g && !res.sums.general){ g.reportedValue = 0; }
    if(made) setTimeout(() => toast(`계좌 ${made}개를 만들었습니다. 계좌 탭에서 개설일과 납입 내역을 입력하세요`), 1900);
  }
  S.cf.importedAt = new Date().toISOString();
  save(); closeSheet(); toast('캐시플로우 내용을 반영했습니다'); render();
}

/* ---------- 캐시플로우 자동 반영: 앱을 열거나 돌아올 때, 이미 연결한 계좌 평가액만 맞춤 ----------
   가족·수입·생활비 등은 지금처럼 '불러오기'로만 바꿈. 연결 안 된 새 자산은 알림만. (이 기기에서 끌 수 있음) */
// 한국 시간 기준 오늘 (UTC로 자르면 오전 9시 전에는 어제 날짜가 됨)
function localDay(d=new Date()){ return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function cfAutoOn(){ try{ return localStorage.getItem('pm_cf_auto') !== '0'; }catch(e){ return true; } }
async function cfAuto(){
  if(!sb || !_user || !cfAutoOn() || !S.cf || !S.cf.map || !Object.keys(S.cf.map).length) return;
  try{
    const r = await sb.from('cashflow_data').select('data,updated_at').eq('household','home').maybeSingle();
    if(r.error || !r.data) return;
    const RB = await rbFetch();
    const items = cfBuild(r.data.data || {}, RB).assets;
    const unmapped = items.filter(a => !(a.cfId in S.cf.map)).length;
    const before = JSON.stringify(S.accounts.map(a => [a.principalRB, a.owner]));
    const { msgs } = cfApplyAccounts(items, S.cf.map, localDay());
    const quiet = JSON.stringify(S.accounts.map(a => [a.principalRB, a.owner])) !== before && !msgs.length;
    if(quiet){ save(); render(); }
    if(msgs.length){ S.cf.autoAt = new Date().toISOString(); save(); render(); toast('캐시플로우 변경 반영: ' + msgs.join(', ')); }
    else if(unmapped) toast(`캐시플로우에 연결 안 된 자산 ${unmapped}개 — 설정 › 캐시플로우에서 불러오기`);
  }catch(e){ console.warn('캐시플로우 자동 반영 실패', e); }
}

      const m = manVal('pMon'); if(!m){ toast('금액을 입력하세요'); return; }
      let x = sim.incomes.find(i=>i.id===d.id); if(!x){ x = { id:uid('i') }; sim.incomes.push(x); }
      Object.assign(x, { name:val('pName').trim()||'수입', kind:val('pKind'), owner:val('pOwner'), monthly:m, startYear:parseInt(val('pFrom'))||null, endYear:parseInt(val('pTo'))||null });
    }
    save(); closeSheet(); render();
  },
  editExtra(){
    const xd = S.profile.sim.extraDeposit || {}, sim = S.profile.sim;
    const opts = S.accounts.filter(a=>!a.closed && E.isPension(a)).map(a=>`<option value="${a.id}" ${xd.to===a.id?'selected':''}>${esc(a.name)} (${TYPES[a.type]}·${esc(memberById(a.owner).name)})</option>`).join('');
    if(!opts){ toast('연금저축이나 IRP 계좌를 먼저 등록하세요'); return; }
    openSheet(formSheet('연금계좌 추가 납입', `
      <label class="f" style="display:flex;gap:8px;align-items:center"><input id="xOn" type="checkbox" ${xd.on!==false?'checked':''}><span style="margin:0;font-size:14px;color:var(--text)">계산에 반영</span></label>
      <label class="f"><span>넣을 계좌</span><select id="xTo">${opts}</select></label>
      <div class="fr"><label class="f"><span>시작 연도</span><input id="xFrom" inputmode="numeric" value="${xd.startYear || (+sim.startYear-1)}"></label>
        <label class="f"><span>기간(년)</span><input id="xYears" inputmode="numeric" value="${xd.years || 2}"></label></div>
      <label class="f"><span>연 금액(만원, 최대 1,800)</span><input id="xAmt" inputmode="decimal" value="${(xd.amount||18000000)/1e4}"></label>
      <p class="note">일반자산에서 꺼내 넣는다고 계산합니다. 은퇴 전 해에는 '연 납입 계획'과 합쳐 1,800만원을 넘지 않게 자동으로 줄입니다. 소득이 없는 해에 넣은 돈은 세액공제는 없지만, 나중에 세금 없이 꺼낼 수 있습니다.</p>`, 'saveExtra', 'x', !!xd.to));
  },
  saveExtra(d){
    const sim = S.profile.sim;
    if(d.del){ delete sim.extraDeposit; }
    else sim.extraDeposit = { on:$('#xOn').checked, to:val('xTo'), startYear:parseInt(val('xFrom'))||(+sim.startYear-1), years:Math.max(1,parseInt(val('xYears'))||1), amount:Math.min(18000000, manVal('xAmt')||0) };
    save(); closeSheet(); render();
  },
  editLump(d){
    const x = (S.profile.sim.lumps||[]).find(i=>i.id===d.id) || {};
    const to = `<option value="">일반자산</option>` + S.accounts.filter(a=>!a.closed).map(a=>`<option value="${a.id}" ${x.to===a.id?'selected':''}>${esc(a.name)} (${TYPES[a.type]})</option>`).join('');
    openSheet(formSheet(x.id?'목돈 수정':'목돈 추가', `
      ${x.src==='cf'?'<p class="note">캐시플로우 항목입니다. 금액·날짜는 다시 불러오면 덮어쓰고, 입금 계좌·퇴직금 표시는 유지됩니다.</p>':''}
      <label class="f"><span>이름</span><input id="lName" value="${esc(x.name||'')}" placeholder="예: 퇴직수당, 자녀 결혼"></label>
      <div class="fr"><label class="f"><span>금액(만원, 지출은 −)</span><input id="lAmt" inputmode="decimal" value="${x.amount?x.amount/1e4:''}" placeholder="-15000"></label>
        <label class="f"><span>시기</span><input id="lMon" type="month" value="${esc(x.month||'')}"></label></div>
      <label class="f" style="display:flex;gap:8px;align-items:center"><input id="lRep" type="checkbox" ${x.repeat?'checked':''}><span style="margin:0;font-size:14px;color:var(--text)">매년 반복</span></label>
      <label class="f"><span>반복 끝</span><input id="lUntil" type="month" value="${esc(x.until||'')}"></label>
      <label class="f"><span>입금 계좌 (+일 때)</span><select id="lTo">${to}</select></label>
      <label class="f" style="display:flex;gap:8px;align-items:center"><input id="lRet" type="checkbox" ${x.kind==='retire'?'checked':''}><span style="margin:0;font-size:14px;color:var(--text)">퇴직금 (IRP 입금 시 퇴직소득세 감면 계산)</span></label>`, 'saveLump', x.id, !!x.id));
  },
  saveLump(d){
    const sim = S.profile.sim; sim.lumps = sim.lumps || [];
    if(d.del){ sim.lumps = sim.lumps.filter(x=>x.id!==d.id); }
    else{
      const a = manVal('lAmt'), mo = val('lMon'); if(!a || !mo){ toast('금액과 시기를 입력하세요'); return; }
      let x = sim.lumps.find(i=>i.id===d.id); if(!x){ x = { id:uid('l') }; sim.lumps.push(x); }
      Object.assign(x, { name:val('lName').trim()||'목돈', amount:a, month:mo, repeat:$('#lRep').checked, until:val('lUntil'), to:val('lTo'), kind:$('#lRet').checked?'retire':'' });
    }
    save(); closeSheet(); render();
  },
  editPhase(d){
    const i = d.i != null && d.i !== '' ? +d.i : -1; const p = i >= 0 ? S.profile.sim.spendPhases[i] : {};
    openSheet(formSheet(i>=0?'생활비 구간 수정':'생활비 구간 추가', `
      <div class="fr"><label class="f"><span>시작 연도</span><input id="phY" inputmode="numeric" value="${p.fromYear||''}"></label>
        <label class="f"><span>월 생활비(만원, 현재가치)</span><input id="phM" inputmode="decimal" value="${p.monthly?p.monthly/1e4:''}"></label></div>
      <p class="note">예: 자녀 독립 후 생활비가 줄어드는 시점</p>`, 'savePhase', i>=0?String(i):'', i>=0));
  },
  savePhase(d){
    const sim = S.profile.sim; sim.spendPhases = sim.spendPhases || [];
    const i = d.id !== '' && d.id != null ? +d.id : -1;
    if(d.del){ sim.spendPhases.splice(i,1); }
    else{
      const y = parseInt(val('phY')), m = manVal('phM'); if(!y || m==null){ toast('연도와 금액을 입력하세요'); return; }
      if(i >= 0) sim.spendPhases[i] = { fromYear:y, monthly:m }; else sim.spendPhases.push({ fromYear:y, monthly:m });
    }
    save(); closeSheet(); render();
  }
};

/* ---------- 액션 ---------- */
const ACTIONS = {
  noop(){},
  newAccount(){ openSheet(accountForm({ type:'pension', owner: ui.owner!=='all'?ui.owner:S.profile.members[0].id })); },
  openAccount(d){ const a=S.accounts.find(x=>x.id===d.id); if(a) openSheet(accountForm(a)); },
  closeSheet(){ closeSheet(); render(); },
  closeSheetBg(d,el,e){ if(e.target===el){ closeSheet(); render(); } },
  saveAccount(d){
    const name = val('fName').trim(); if(!name){ toast('계좌 이름을 입력하세요'); return; }
    let a = d.id ? S.accounts.find(x=>x.id===d.id) : null;
    if(!a){ a = { id:uid('a'), history:[] }; S.accounts.push(a); }
    if(a.owner && a.owner !== val('fOwner')) a.ownerSrc = 'manual';
    Object.assign(a, { type:val('fType'), owner:val('fOwner'), name, institution:val('fInst').trim(), openedAt:val('fOpened'),
      plannedAnnual: manVal('fPlanned')||0, isaKind:val('fIsaKind'), isaMaturity:val('fMat'), isaToPension:val('fToP'),
      retireTaxRate: parseFloat(val('fRet'))||0, riskyPct: parseFloat(val('fRisky'))||0, lifelong: !!($('#fLifelong')&&$('#fLifelong').checked) });
    save(); toast('저장했습니다'); openSheet(accountForm(a));
  },
  saveValue(d){
    const a=S.accounts.find(x=>x.id===d.id); const v=manVal('fVal'); const date=val('fValDate');
    if(v==null){ toast('평가액을 입력하세요'); return; }
    a.reportedValue=v; a.valueDate=date; a.history=(a.history||[]).filter(h=>h.date!==date); a.history.push({date,value:v}); a.history.sort((x,y)=>x.date<y.date?-1:1);
    save(); toast('평가액 업데이트'); openSheet(accountForm(a));
  },
  addDeposit(d){
    const amt=manVal('dAmt'), date=val('dDate'); if(!amt||!date){ toast('날짜와 금액을 입력하세요'); return; }
    S.deposits.push({ id:uid('d'), accountId:d.id, date, amount:amt, kind:val('dKind'), source:'MANUAL' });
    save(); openSheet(accountForm(S.accounts.find(x=>x.id===d.id)));
  },
  delDeposit(d){ S.deposits=S.deposits.filter(x=>x.id!==d.id); save(); openSheet(accountForm(S.accounts.find(x=>x.id===d.acc))); },
  delAccount(d){ if(!confirm('이 계좌와 납입 내역을 삭제할까요?')) return; S.accounts=S.accounts.filter(x=>x.id!==d.id); S.deposits=S.deposits.filter(x=>x.accountId!==d.id); save(); closeSheet(); render(); },
  pickStrat(d){ ui.strat=d.k; ui.stratPicked = true; render(); },
  export(){
    const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=u; a.download=`pension-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
  },
  import(){ const f=$('#importFile'); f.onchange=()=>{ const file=f.files[0]; if(!file) return; file.text().then(t=>{ try{ S=migrate(JSON.parse(t)); save(); toast('불러왔습니다'); render(); }catch(e){ toast('백업 파일 형식이 아닙니다'); } }); }; f.click(); },
  reset(){ if(!confirm('모든 데이터를 지울까요? 먼저 백업을 권장합니다.')) return; S=defaultState(); save(); render(); },
  sample(){ S = sampleState(); save(); toast('예시 데이터를 불러왔습니다 (설정에서 초기화 가능)'); render(); }
};

function sampleState(){
  const s = defaultState();
  s.profile.members[0].publicPension.monthly = 3000000; s.profile.members[0].publicPension.startYear = THIS_YEAR+5;
  s.profile.sim = { startYear:THIS_YEAR+5, endAge:90, monthlyNeed:5000000, otherMonthly:300000, returnRate:4, inflation:2 };
  const A = (o)=>Object.assign({ history:[], institution:'' }, o);
  s.accounts = [
    A({id:'s1',owner:'me',type:'pension',name:'연금저축1',openedAt:'2015-03-01',plannedAnnual:6000000,reportedValue:72000000,valueDate:`${THIS_YEAR}-11-01`}),
    A({id:'s2',owner:'spouse',type:'pension',name:'연금저축(배우자)',openedAt:'2018-01-01',plannedAnnual:6000000,reportedValue:31000000,valueDate:`${THIS_YEAR}-11-01`}),
    A({id:'s3',owner:'me',type:'irp',name:'IRP',openedAt:`${THIS_YEAR}-01-10`,plannedAnnual:3000000,reportedValue:3100000,valueDate:`${THIS_YEAR}-11-01`,retireTaxRate:3.5,riskyPct:65}),
    A({id:'s4',owner:'me',type:'isa',name:'ISA',openedAt:`${THIS_YEAR}-02-01`,plannedAnnual:20000000,isaKind:'normal',isaMaturity:`${THIS_YEAR+3}-02-01`,isaToPension:'s1',reportedValue:21500000,valueDate:`${THIS_YEAR}-11-01`}),
    A({id:'s5',owner:'me',type:'general',name:'일반 주식계좌',openedAt:'2010-01-01',reportedValue:150000000,valueDate:`${THIS_YEAR}-11-01`})
  ];
  let i=0; const D=(acc,date,amount,kind)=>({id:'sd'+(i++),accountId:acc,date,amount,kind,source:'MANUAL'});
  s.deposits = [];
  for(let y=2015;y<THIS_YEAR;y++) s.deposits.push(D('s1',`${y}-12-20`, y<2020?4000000:6000000, 'personal'));
  s.deposits.push(D('s1',`${THIS_YEAR}-06-01`,4000000,'personal'));
  for(let y=2018;y<THIS_YEAR;y++) s.deposits.push(D('s2',`${y}-12-20`,3000000,'personal'));
  s.deposits.push(D('s3',`${THIS_YEAR}-03-01`,3000000,'personal'));
  s.deposits.push(D('s4',`${THIS_YEAR}-02-01`,20000000,'personal'));
  s.deposits.push(D('s5','2010-01-01',100000000,'personal'));
  return s;
}

Object.assign(ACTIONS, PLAN_ACTIONS);
// 홈 화면 앱 설치용 서비스 워커 (캐시 없음 — 항상 최신 화면)
if('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('서비스 워커 등록 실패', e));
render();
setCloud('off');
if(sb){
  sb.auth.onAuthStateChange((ev, session) => {
    const u = session ? session.user : null;
    const changed = (u && u.id) !== (_user && _user.id);
    _user = u;
    if(!u){ setCloud('off'); return; }
    if(changed){ setTimeout(async () => { await cloudPull(); if(ui.tab==='set') render(); setTimeout(cfAuto, 300); }, 0); }
  });
  // 동기화를 먼저 받은 뒤 캐시플로우 자동 반영 (서버 장부를 덮어쓰지 않도록)
  document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible' && _user){ await cloudPull(); setTimeout(cfAuto, 300); } });
}
})();
</script>
